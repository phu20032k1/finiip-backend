name: Deploy Finiip Backend to Fly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fly-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Fly deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret FLY_API_TOKEN. Create a Fly deploy token and save it as repository secret FLY_API_TOKEN."
            exit 1
          fi

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy production backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app finiip-backend

      - name: Verify live Health + Chat + Accounting APIs
        run: |
          set -e
          BASE='https://finiip-backend.fly.dev'
          success=0

          for attempt in $(seq 1 18); do
            echo "Post-deploy live probe ${attempt}/18"

            if curl -fsS --connect-timeout 5 --max-time 15 "$BASE/api/v1/health" >/tmp/finiip-health.json \
              && curl -fsS --connect-timeout 5 --max-time 15 \
                -H 'X-API-Key: finiip' \
                -H 'X-Workspace-ID: deploy-smoke' \
                -H 'X-User-ID: github-actions' \
                "$BASE/api/v1/chat/status" >/tmp/finiip-chat.json \
              && curl -fsS --connect-timeout 5 --max-time 15 \
                -H 'X-API-Key: finiip' \
                -H 'X-Workspace-ID: deploy-smoke' \
                -H 'X-User-ID: github-actions' \
                "$BASE/api/v112/accounting/modules" >/tmp/finiip-accounting.json; then
              success=1
              break
            fi

            sleep 10
          done

          if [ "$success" != 1 ]; then
            echo "::error::Fly deployment completed but live Health/Chat/Accounting smoke did not pass."
            exit 1
          fi

          echo 'Fly production is live: Health OK, Chat API OK, Accounting API OK.'
