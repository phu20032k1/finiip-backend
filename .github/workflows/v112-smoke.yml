name: V112 Backend Smoke

on:
  pull_request:
  push:
    branches:
      - agent/accounting-suite-v112

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile V112 app wrapper
        run: python -m py_compile main_v112.py
      - name: Compile V112 Accounting Suite
        run: python -m py_compile accounting_suite_v112.py
      - name: Compile existing main app
        run: python -m py_compile main.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: HTTP smoke V112 accounting routes
        env:
          DATABASE_URL: sqlite:///./ci_v112.db
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main_v112 import app

          client = TestClient(app)
          checks = [
              '/api/v112/accounting/modules',
              '/api/v112/accounting/dashboard',
              '/api/v112/accounting/documents?module=cash&limit=5',
              '/api/v112/accounting/reconciliation',
          ]
          for path in checks:
              response = client.get(path, headers={
                  'X-Workspace-ID': 'ci-v112',
                  'X-User-ID': 'github-actions',
              })
              assert response.status_code == 200, f'{path}: {response.status_code} {response.text[:500]}'
              print(f'OK {response.status_code} {path}')
          PY
