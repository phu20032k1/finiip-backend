name: V112 Backend Smoke

on:
  pull_request:
  push:
    branches:
      - agent/accounting-suite-v112

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile V112 app wrapper
        run: python -m py_compile main_v112.py
      - name: Compile V112 Accounting Suite
        run: python -m py_compile accounting_suite_v112.py
      - name: Compile existing main app
        run: python -m py_compile main.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Import V112 app and verify routes
        env:
          DATABASE_URL: sqlite:///./ci_v112.db
        run: |
          python - <<'PY'
          from main_v112 import app
          paths = {route.path for route in app.routes}
          required = {
              '/api/v112/accounting/modules',
              '/api/v112/accounting/dashboard',
              '/api/v112/accounting/documents',
              '/api/v112/accounting/reconciliation',
          }
          missing = required - paths
          assert not missing, f'Missing V112 routes: {sorted(missing)}'
          print(f'V112 app import OK: {len(paths)} routes, required accounting routes present')
          PY
