# Fly.io configuration for Finiip backend
# Primary goal: low idle cost, reliable cold starts, and enough headroom for OCR/PDF bursts.

app = "finiip-backend"
primary_region = "sin"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
